name: CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # `CIS_DASHBOARD_SECRET` is required by the test suite to initialize
    # Flask sessions during automated runs. This value is safe for CI only
    # (not used in production). Adjust or move to GitHub Secrets if needed.
    env:
      CIS_DASHBOARD_SECRET: ci_test_secret_012345678901234567890123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cis/requirements.txt
          python -m pip install Flask pytest

      - name: Run validation scripts
        env:
          PYTHONPATH: cis
        run: |
          python scripts/test_snapshot.py
          python scripts/test_playbook_runner.py
          python scripts/test_playbook_runner.py --apply
          python scripts/test_intel.py
          python scripts/test_ot_integration.py
          python scripts/test_explain.py
          python scripts/test_zero_trust.py
          python scripts/test_deception.py
          python scripts/test_compliance_report.py

      - name: Run unit tests
        env:
          PYTHONPATH: cis
        run: |
          python -m pytest cis/tests -q

  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      SIEM_SHARED_SECRET: ${{ secrets.SIEM_SHARED_SECRET }}
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend

      - name: Build frontend
        run: |
          npm run build --prefix frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend unit tests
        if: always()
        run: |
          if [ -d backend/tests ]; then python -m pytest backend/tests -q; else echo "No backend tests found"; fi

      - name: Docker Compose smoke test
        uses: docker/compose-action@v2
        with:
          files: docker-compose.yml
          run: up -d --build

      - name: Wait for services
        run: |
          sleep 5

      - name: Health check backend
        run: |
          curl --fail http://localhost:8000/ || (docker compose down && exit 1)

      - name: Tear down
        if: always()
        run: |
          docker compose down --remove-orphans

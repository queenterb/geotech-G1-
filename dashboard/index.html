<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ransomware Detection Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: #f8f9fa;
        }

        .status-secure {
            color: #28a745;
            font-weight: bold;
        }

        .status-danger {
            color: #dc3545;
            font-weight: bold;
        }

        .metrics-card {
            min-width: 120px;
        }

        .alert-info {
            background: #e7f3fe;
        }

        .alert-low {
            background: #fff3cd;
        }

        .alert-high {
            background: #f8d7da;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h2><span id="system-status" class="status-secure">🛡️ SYSTEM SECURE</span></h2>
        <div class="row my-3">
            <div class="col metrics-card">Mods/min: <span id="mods">0</span></div>
            <div class="col metrics-card">Renames/min: <span id="renames">0</span></div>
            <div class="col metrics-card">Entropy: <span id="entropy">0</span></div>
            <div class="col metrics-card">Connections: <span id="connections">0</span></div>
            <div class="col metrics-card">Susp. Ext: <span id="susp_ext">0</span></div>
            <div class="col metrics-card">Susp. IPs: <span id="susp_ips">0</span></div>
            <div class="col metrics-card">OUT KB/s: <span id="out_kbs">0</span></div>
            <div class="col metrics-card">C2 Status: <span id="c2_status">Clear</span></div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <h5>File Activity</h5>
                <canvas id="fileChart" height="120"></canvas>
            </div>
            <div class="col-md-6">
                <h5>Network Activity</h5>
                <canvas id="networkChart" height="120"></canvas>
            </div>
        </div>
        <h4 class="mt-4">Real-Time Alerts <span id="alert-count" class="badge bg-secondary">0</span></h4>
        <ul id="alerts" class="list-group"></ul>
    </div>
    <script src="dashboard.js"></script>
</body>

</html>

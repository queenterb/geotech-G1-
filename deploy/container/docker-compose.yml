version: "3.9"
services:
  cis-main:
    build:
      context: ../../
      dockerfile: deploy/container/Dockerfile
    container_name: cis-main
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /tmp:/tmp
    environment:
      - CIS_HOST=0.0.0.0
      - CIS_PORT=8000
      - CIS_SIEM_HTTP_ENDPOINT=http://backend:8000/api/alerts
      - CIS_SIEM_BEARER_TOKEN=dev_cis_token_change_me
      - SIEM_SHARED_SECRET=dev_cis_token_change_me
    command: [ "python", "-m", "cis.service" ]

  cis-sidechannel:
    build:
      context: ../../
      dockerfile: deploy/container/Dockerfile
    container_name: cis-sidechannel
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    devices:
      - /dev/snd:/dev/snd
    command: [ "python", "side_channel_daemon.py" ]

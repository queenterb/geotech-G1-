version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cis-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cis_dashboard
      POSTGRES_USER: cis_user
      POSTGRES_PASSWORD: cis_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cis-dashboard-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cis-dashboard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cis_user:cis_pass@postgres:5432/cis_dashboard
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecret_local_change_me
      BACKEND_CORS_ORIGINS: http://localhost:4173,http://localhost:8080
      CIS_SIEM_HTTP_ENDPOINT: http://backend:8000/api/alerts
      CIS_SIEM_BEARER_TOKEN: dev_cis_token_change_me
      SIEM_SHARED_SECRET: dev_cis_token_change_me
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cis-dashboard-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8000/api
      VITE_STREAM_URL: http://media:80/hls/stream.m3u8
    ports:
      - '4173:4173'
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: cis-dashboard-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  media:
    image: alfg/nginx-rtmp
    container_name: cis-dashboard-media
    restart: unless-stopped
    ports:
      - '1935:1935'   # RTMP ingest
      - '8082:80'     # HLS output
    volumes:
      - ./nginx/rtmp.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  behavior_worker:
    build:
      context: ./cis
      dockerfile: Dockerfile
    container_name: cis-behavior-worker
    restart: unless-stopped
    environment:
      STREAM_URL: http://media:80/hls/stream.m3u8
      API_ENDPOINT: http://backend:8000/api/alerts
      CIS_SIEM_BEARER_TOKEN: dev_cis_token_change_me
      MOTION_THRESHOLD: '6000'
      CHECK_INTERVAL: '1.0'
    depends_on:
      - media
      - backend

volumes:
  postgres_data:
  redis_data:
